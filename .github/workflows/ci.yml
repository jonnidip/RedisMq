name: CI

on:
  push:
    branches: [ main, m0-protocol-shell ]
  pull_request:
    branches: [ main, m0-protocol-shell ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build
        run: dotnet build RedisMQ.sln

      - name: Test
        run: dotnet test RedisMQ.sln --no-restore --no-build

  perf:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Build (Release)
        run: dotnet build RedisMQ.sln -c Release
      - name: Run performance gate
        run: |
          ulimit -n 65535
          dotnet run -c Release --no-build --project benchmarks/RedisMQ.Benchmarks -- --scenario all --out artifacts/perf.json
      - name: Upload performance report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: perf-report
          path: artifacts/perf.json
          if-no-files-found: warn

  conformance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        client: [pika, node, java, go]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Setup Python
        if: matrix.client == 'pika'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Node
        if: matrix.client == 'node'
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Setup Java
        if: matrix.client == 'java'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Setup Go
        if: matrix.client == 'go'
        uses: actions/setup-go@v5
        with:
          go-version: 'stable'

      - name: Run client conformance
        run: pwsh tests/clients/run.ps1 -Client ${{ matrix.client }}

      - name: Upload broker log
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: conformance-${{ matrix.client }}-logs
          path: tests/clients/.logs/**
          if-no-files-found: ignore

  pack:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Build (Release)
        run: dotnet build RedisMQ.sln -c Release

      - name: Pack
        run: dotnet pack RedisMQ.sln -c Release --no-build -o artifacts

      - name: Core has no package references
        run: |
          dotnet list src/RedisMQ.Broker/RedisMQ.Broker.csproj package --include-transitive --format json > core-packages.json
          if ! jq -e '[.projects[].frameworks[] | (.topLevelPackages // []) + (.transitivePackages // [])] | flatten | length == 0' core-packages.json; then
            echo "RedisMQ.Broker gained a package reference (or the package list could not be read)"
            exit 1
          fi

      - name: Upload packages
        uses: actions/upload-artifact@v4
        with:
          name: nuget-packages
          path: |
            artifacts/*.nupkg
            artifacts/*.snupkg

  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build image
        run: docker build -t redismq:ci .
